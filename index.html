<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen 2 平台件状态矩阵</title>
<style>
:root {
  --bg: #faf9f7;
  --surface: #ffffff;
  --surface-2: #f5f3f0;
  --surface-3: #ede9e3;
  --border: #e2ddd5;
  --border-light: #eeebe6;
  --primary: #c97b4a;
  --accent: #7c9885;
  --text: #2d2a26;
  --text-2: #5c5650;
  --muted: #9c958b;
  --green: #5a9e6f;
  --green-bg: #e8f3eb;
  --orange: #d49442;
  --orange-bg: #fbf0e0;
  --red: #c75d5d;
  --red-bg: #f8e8e8;
  --blue: #6b8db5;
  --blue-bg: #e8f0f8;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-hover: 0 4px 16px rgba(0,0,0,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
html {
  overflow-y: scroll;
  scrollbar-gutter: stable;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}
/* Header */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 20px 32px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: var(--shadow);
}
.header h1 {
  font-size: 22px; font-weight: 700;
  color: var(--text);
}
.header .subtitle { color: var(--muted); font-size: 12px; margin-top: 4px; }
/* Stats bar */
.stats-bar {
  display: flex; gap: 12px; flex-wrap: wrap;
  padding: 16px 32px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-light);
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 24px;
  text-align: center;
  min-width: 112px;
  transition: all 0.2s ease;
  cursor: pointer;
  box-shadow: var(--shadow);
}
.stat-card:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}
.stat-card .num {
  font-size: 32px; font-weight: 700;
  font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
  line-height: 1.2;
}
.stat-card .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
.stat-card.green .num { color: var(--green); }
.stat-card.orange .num { color: var(--orange); }
.stat-card.red .num { color: var(--red); }
.stat-card.blue .num { color: var(--blue); }
.stat-card.warm .num { color: var(--primary); }
.stat-card.clickable::after {
  content: '▸';
  font-size: 10px;
  color: var(--muted);
  margin-left: 4px;
}
/* Toolbar */
.toolbar {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 32px 8px;
  flex-wrap: wrap;
  background: var(--bg);
  position: sticky; top: 144px; z-index: 49;
}
.search-box {
  flex: 1; min-width: 240px;
  position: relative;
}
.search-box input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 16px 8px 36px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  box-shadow: var(--shadow);
}
.search-box input:focus { border-color: var(--primary); }
.search-box input::placeholder { color: var(--muted); }
.search-box svg {
  position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  color: var(--muted);
}
.filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  padding: 6px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  user-select: none;
  box-shadow: var(--shadow);
}
.chip:hover { border-color: var(--primary); color: var(--text); }
.chip.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
  font-weight: 600;
}
/* Matrix Grid */
.matrix-wrap {
  padding: 0 32px 32px;
  background: var(--bg);
}
.matrix-info {
  font-size: 12px; color: var(--muted);
  padding: 16px 0 12px;
  display: flex; align-items: center; gap: 8px;
  background: var(--bg);
  position: sticky; top: 207px; z-index: 48;
}
.matrix-info svg { width: 14px; height: 14px; }
.matrix-table {
  border-collapse: separate;
  border-spacing: 6px;
  table-layout: fixed;
  background: var(--bg);
}
.matrix-table th {
  padding: 6px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-2);
  text-align: center;
  white-space: nowrap;
  background: var(--surface-2);
  border-radius: 6px;
  border: 1px solid var(--border-light);
}
.matrix-table th.row-header {
  text-align: center;
  width: 122px;
  position: sticky; left: 0; z-index: 10;
  background: var(--surface-3);
  font-size: 13px;
}
/* Sticky column headers (Sensor row) */
.matrix-table thead th {
  position: sticky; top: 238px; z-index: 11;
  border-radius: 0;
  box-shadow: 0 0 0 5px var(--bg);
  clip-path: polygon(-6px -6px, calc(100% + 6px) -6px, calc(100% + 6px) 100%, -6px 100%);
}
/* Corner cell: sticky in BOTH directions */
.matrix-table thead th.row-header {
  position: sticky; top: 238px; left: 0; z-index: 13;
}
.matrix-table th.col-header {
  width: 120px;
  padding: 14px 4px;
  vertical-align: bottom;
}
.matrix-table th.col-header .chip-name {
  font-size: 13px;
  color: var(--primary);
}
.matrix-table th.col-header .chip-sub {
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
}
/* Matrix cells */
.matrix-cell {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 4px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
  vertical-align: middle;
  width: 120px;
  position: relative;
  box-shadow: var(--shadow);
}
.matrix-cell:hover {
  border-color: var(--primary);
  transform: scale(1.05);
  z-index: 5;
  box-shadow: var(--shadow-hover);
}
.matrix-cell.empty {
  background: var(--bg);
  border: 1px dashed var(--border);
  cursor: default;
  box-shadow: none;
}
.matrix-cell.empty:hover {
  border-color: var(--border);
  background: transparent;
  transform: none;
  box-shadow: none;
}
.matrix-cell .count {
  font-size: 22px;
  font-weight: 800;
  font-family: 'SF Mono', 'Consolas', monospace;
  line-height: 1.15;
}
.matrix-cell .count-label {
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
}
.matrix-cell .status-dots {
  display: flex;
  justify-content: center;
  gap: 3px;
  margin-top: 4px;
}
.matrix-cell .dot {
  width: 9px; height: 9px;
  border-radius: 50%;
}
/* Full background fill by status */
.matrix-cell.all-green {
  background: var(--green-bg);
  border-color: var(--green);
}
.matrix-cell.all-orange {
  background: var(--orange-bg);
  border-color: var(--orange);
}
.matrix-cell.all-red {
  background: var(--red-bg);
  border-color: var(--red);
}
.matrix-cell.mixed {
  background: linear-gradient(135deg, var(--surface-2), var(--surface-3));
  border-color: var(--primary);
}
.matrix-cell.all-green .count { color: var(--green); }
.matrix-cell.all-orange .count { color: var(--orange); }
.matrix-cell.all-red .count { color: var(--red); }
.matrix-cell.mixed .count { color: var(--primary); }
/* Legend */
.legend {
  display: flex; gap: 16px; flex-wrap: wrap;
  padding: 12px 32px;
  background: var(--surface);
  border-top: 1px solid var(--border-light);
  border-bottom: 1px solid var(--border-light);
  position: sticky; top: 99px; z-index: 50;
}
.legend-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--muted);
}
.legend-dot { width: 10px; height: 10px; border-radius: 3px; }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(45,42,38,0.4);
  backdrop-filter: blur(4px);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; animation: fadeIn 0.2s; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  max-width: 95vw;
  max-height: 90vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.3s ease;
  box-shadow: 0 20px 60px rgba(0,0,0,0.12);
}
.modal-header {
  padding: 20px 24px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.modal-title .sensor-name { color: var(--primary); }
.modal-title .chip-name { color: var(--accent); }
.modal-title .sep { color: var(--muted); margin: 0 8px; }
.modal-title .stat-label { color: var(--text-2); }
.modal-close {
  background: var(--surface-3);
  border: none;
  border-radius: 8px;
  width: 32px; height: 32px;
  color: var(--muted);
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--red); color: white; }
.modal-body {
  padding: 0;
  overflow-y: auto;
  flex: 1;
}
.modal-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.modal-table thead th {
  background: var(--surface-2);
  padding: 10px 14px;
  text-align: left;
  font-weight: 600;
  font-size: 12px;
  color: var(--text-2);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  position: sticky; top: 0;
}
.modal-table tbody td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-light);
  white-space: nowrap;
}
.modal-table tbody tr:hover { background: var(--surface-2); }
.modal-table tbody tr.group-row td {
  background: var(--surface-2);
  font-weight: 700;
  color: var(--primary);
  border-top: 1px solid var(--border);
}
/* Badges */
.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
}
.badge-green { background: var(--green-bg); color: var(--green); }
.badge-orange { background: var(--orange-bg); color: var(--orange); }
.badge-red { background: var(--red-bg); color: var(--red); }
.badge-muted { background: var(--surface-3); color: var(--muted); }
/* Animations */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
/* Scrollbar */
::-webkit-scrollbar { height: 8px; width: 8px; }
::-webkit-scrollbar-track { background: var(--surface-2); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary); }
/* Responsive */
@media (max-width: 768px) {
  .header, .stats-bar, .toolbar, .matrix-wrap, .legend { padding-left: 16px; padding-right: 16px; }
  .stat-card { min-width: 72px; padding: 8px 12px; }
  .stat-card .num { font-size: 22px; }
}
/* Action buttons */
.btn-add {
  padding: 8px 18px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  box-shadow: var(--shadow);
  white-space: nowrap;
}
.btn-add:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
.btn-secondary {
  padding: 6px 14px;
  background: var(--surface);
  color: var(--text-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  box-shadow: var(--shadow);
  white-space: nowrap;
}
.btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
/* Form modal */
.form-modal { max-width: 680px; }
.form-body {
  padding: 24px;
  overflow-y: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.form-field { display: flex; flex-direction: column; gap: 4px; }
.form-field.full { grid-column: 1 / -1; }
.form-field label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.form-field label .req { color: var(--red); }
.form-field input, .form-field select {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 13px;
  color: var(--text);
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}
.form-field input:focus, .form-field select:focus { border-color: var(--primary); }
.form-footer {
  padding: 16px 24px;
  background: var(--surface-2);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}
/* Row action buttons */
.row-actions {
  display: flex;
  gap: 6px;
}
.row-btn {
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  background: var(--surface);
  color: var(--text-2);
}
.row-btn:hover { border-color: var(--primary); color: var(--primary); }
.row-btn.danger:hover { border-color: var(--red); color: var(--red); }
/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--surface);
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 13px;
  z-index: 2000;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
/* Export dropdown */
.export-dropdown { position: relative; display: inline-block; }
.export-menu {
  display: none;
  position: absolute;
  top: 100%; right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  min-width: 160px;
  z-index: 200;
  overflow: hidden;
  margin-top: 4px;
}
.export-menu.show { display: block; animation: fadeIn 0.15s; }
.export-menu-item {
  padding: 10px 18px;
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  transition: background 0.15s;
  display: flex; align-items: center; gap: 8px;
  white-space: nowrap;
}
.export-menu-item:hover { background: var(--surface-2); color: var(--primary); }
.export-menu-item .fmt-icon { font-size: 16px; }
.export-menu-divider { height: 1px; background: var(--border-light); }
/* Sync indicator */
.sync-indicator {
  font-size: 11px; color: var(--muted);
  padding: 4px 10px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--border-light);
  white-space: nowrap; transition: all 0.3s;
}
.sync-indicator.synced { color: var(--green); border-color: var(--green); }
.sync-indicator.syncing { color: var(--orange); border-color: var(--orange); }
.sync-indicator.error { color: var(--red); border-color: var(--red); }
</style>
</head>
<body>

<div class="header">
  <h1>Gen 2 平台件状态矩阵</h1>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="legend">
  <div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span>已出样</div>
  <div class="legend-item"><span class="legend-dot" style="background:var(--orange)"></span>待出样</div>
  <div class="legend-item"><span class="legend-dot" style="background:var(--red)"></span>待设计</div>
  <div class="legend-item"><span class="legend-dot" style="background:transparent;border:1px dashed var(--border)"></span>无方案</div>
  <div class="legend-item" style="margin-left:auto">💡 点击格子查看全部规格变体 · 点击统计卡查看分类明细</div>
</div>

<div class="toolbar">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="搜索 Sensor / Serdes / 芯片 / GPIO / 项目代号 / 客户...">
  </div>
  <div class="filter-chips" id="filterChips">
    <div class="chip active" onclick="setFilter(event,'')">全部</div>
    <div class="chip" onclick="setFilter(event,'已出样')">已出样</div>
    <div class="chip" onclick="setFilter(event,'待出样')">待出样</div>
    <div class="chip" onclick="setFilter(event,'待设计')">待设计</div>
  </div>
  <button class="btn-add" onclick="openAddForm()">+ 添加产品</button>
  <div class="export-dropdown">
    <button class="btn-secondary" onclick="toggleExportMenu(event)">导出数据 ▾</button>
    <div class="export-menu" id="exportMenu">
      <div class="export-menu-item" onclick="exportJSON()"><span class="fmt-icon">📄</span>JSON</div>
      <div class="export-menu-item" onclick="exportCSV()"><span class="fmt-icon">📋</span>CSV</div>
      <div class="export-menu-item" onclick="exportExcel()"><span class="fmt-icon">📊</span>Excel (.xls)</div>

    </div>
  </div>
  <button class="btn-secondary" onclick="refreshFromCloud()" title="从云端重新加载数据">🔄 刷新</button>
  <span class="sync-indicator" id="syncIndicator">加载中...</span>
</div>

<div class="matrix-wrap">
  <div class="matrix-info">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    纵轴 = Lens 型号 · 横轴 = Sensor 型号 · 格内数字 = 该组合下的产品变体数量 · 点击查看按 Serdes 分组的详情
  </div>
  <div id="matrixContainer"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Form Modal -->
<div class="modal-overlay" id="formOverlay" onclick="closeForm(event)">
  <div class="modal form-modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="formTitle">添加新产品</div>
      <button class="modal-close" onclick="closeForm()">✕</button>
    </div>
    <div class="form-body" id="formBody"></div>
    <div class="form-footer">
      <button class="btn-secondary" onclick="closeForm()">取消</button>
      <button class="btn-add" onclick="saveProduct()">保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>

const BUILTIN_PRODUCTS = [
  ["", "CSP", "MIPI", "1", "", "OX08D10", "/", "Horizon", "H120°", "SF817", "", "/", "FS8V045A-100-00", "已出样", "OK", "ROHM"],

  ["前视", "CSP", "LVDS", "", "奇瑞 / 小鹏 / 奔驰", "OX08D10", "MAX961717", "Horizon", "H30°", "SF816VM", "25×25", "TE", "FS8V048A-100-00", "待出样", "OK", "ROHM"],
  ["前视", "CSP", "LVDS", "", "奇瑞 / 小鹏 / 奔驰", "OX08D10", "MAX961717", "Horizon", "H70°", "SS801BX", "25×25", "TE", "", "已出样", "OK", "ROHM"],

// ========== DATA LOADING ==========
let PRODUCTS = [];
let editingIndex = -1;

function showSyncStatus(text, cls) {
  const el = document.getElementById("syncIndicator");
  if (!el) return;
  el.textContent = text;
  el.className = "sync-indicator" + (cls ? " " + cls : "");
}

async function loadData() {
  if (cloudEnabled()) {
    showSyncStatus("加载中...", "syncing");
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);
      const resp = await fetch(cloudRawUrl() + "?t=" + Date.now(), { signal: controller.signal });
      clearTimeout(timeoutId);
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const data = await resp.json();
      if (Array.isArray(data) && data.length > 0 && Array.isArray(data[0]) && data[0].length >= 16) {
        PRODUCTS = data;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(PRODUCTS));
        showSyncStatus("☁ 已同步", "synced");
        return;
      }
    } catch(e) {
      console.log("Cloud load failed:", e.message);
      showSyncStatus("离线模式", "error");
    }
  }
  // Fallback to localStorage
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try {
      const parsed = JSON.parse(stored);
      if (Array.isArray(parsed) && parsed.length > 0 && Array.isArray(parsed[0]) && parsed[0].length >= 16) {
        PRODUCTS = parsed;
      } else {
        PRODUCTS = BUILTIN_PRODUCTS.map(r => [...r]);
        saveData();
      }
    } catch(e) {
      PRODUCTS = BUILTIN_PRODUCTS.map(r => [...r]);
      saveData();
    }
  } else {
    PRODUCTS = BUILTIN_PRODUCTS.map(r => [...r]);
    saveData();
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(PRODUCTS));
  if (cloudEnabled()) syncToCloud();
}

function syncToCloud() {
  showSyncStatus("同步中...", "syncing");
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(PRODUCTS))));
  const apiUrl = cloudApiUrl();
  const token = getGitHubToken();
  const headers = {
    "Authorization": `Bearer ${token}`,
    "Content-Type": "application/json"
  };
  // Step 1: Get current file SHA
  fetch(apiUrl, { headers })
    .then(r => r.json())
    .then(data => {
      // Step 2: Update file with SHA
      return fetch(apiUrl, {
        method: "PUT",
        headers,
        body: JSON.stringify({
          message: "Update product matrix " + new Date().toLocaleString("zh-CN"),
          content: content,
          sha: data.sha,
          branch: CLOUD_CONFIG.branch
        })
      });
    })
    .then(() => showSyncStatus("☁ 已同步", "synced"))
    .catch(err => {
      console.log("Cloud sync failed:", err);
      showSyncStatus("同步失败", "error");
    });
}

function refreshFromCloud() {
  if (!cloudEnabled()) { promptToken(); return; }
  loadData().then(() => {
    renderStats();
    buildMatrix();
    showToast("数据已刷新");
  });
}

function promptToken() {
  const existing = getGitHubToken();
  const hint = existing ? "（已设置，留空则清除）" : "";
  const token = prompt("请输入 GitHub Personal Access Token" + hint + "\n\n获取方式：GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate new token → 勾选 repo 权限", existing);
  if (token === null) return; // 取消
  if (token.trim() === "") {
    localStorage.removeItem(TOKEN_KEY);
    showSyncStatus("未配置云端");
    showToast("Token 已清除");
  } else {
    localStorage.setItem(TOKEN_KEY, token.trim());
    showSyncStatus("Token 已设置", "synced");
    showToast("Token 已保存，正在加载数据");
    loadData().then(() => {
      renderStats();
      buildMatrix();
    });
  }
}

// ========== STATE ==========
let searchTerm = "";
let statusFilter = "";

// ========== HELPERS ==========
function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function escapeAttr(str) {
  return String(str).replace(/'/g,"\\'").replace(/"/g,"&quot;");
}
function getBadgeClass(val) {
  if (val === "已出样" || val === "OK") return "badge-green";
  if (val === "待出样") return "badge-orange";
  if (val === "待设计" || val.startsWith("NG")) return "badge-red";
  if (val === "/" || val === "TBD" || val === "") return "badge-muted";
  return "";
}
function cellHtml(val, isStatus) {
  if (val === "" || val === "/") return '<span style="color:var(--muted)">—</span>';
  if (isStatus) {
    const cls = getBadgeClass(val);
    if (cls) return `<span class="badge ${cls}">${escapeHtml(val)}</span>`;
  }
  return escapeHtml(val);
}

// ========== SENSOR FAMILY GROUPING ==========
function sensorFamily(sensor) {
  if (sensor.startsWith("IMX728")) return "IMX728";
  if (sensor.startsWith("S5K1H1")) return "S5K1H1";
  return sensor;
}

// ========== PRODUCT TYPE INHERIT ==========
function getTypedProducts() {
  let currentType = "";
  return PRODUCTS.map((r, i) => {
    let row = [...r];
    if (row[COL.type]) currentType = row[COL.type];
    row[COL.type] = currentType;
    return { row, index: i, type: currentType, sensor: row[COL.sensor], sensorFam: sensorFamily(row[COL.sensor]), serdes: row[COL.serdes], lens: row[COL.lens], status: row[COL.status] };
  });
}

function getFilteredProducts() {
  let products = getTypedProducts();
  if (searchTerm) {
    const term = searchTerm.toLowerCase();
    products = products.filter(p => p.row.some(c => String(c).toLowerCase().includes(term)));
  }
  if (statusFilter) {
    products = products.filter(p => p.status === statusFilter);
  }
  return products;
}

  let total=products.length, sampled=0, pending=0, designing=0, specOk=0;

  products.forEach(p => {

    {num: rate, label: "出样率", cls: "green", filter: null}

  document.getElementById("statsBar").innerHTML = stats.map((s, i) => {

    return `<div class="stat-card ${s.cls}${clickableCls}" ${clickAttr}><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`;
  }).join("");
}

// ========== MATRIX ==========
function buildMatrix() {
  const products = getFilteredProducts();
  const lenses = [...new Set(products.map(p => p.lens))].sort();
  const sensorFams = [...new Set(products.map(p => p.sensorFam))].sort();
  const comboMap = {};
  products.forEach(p => {
    const key = `${p.lens}|||${p.sensorFam}`;
    if (!comboMap[key]) comboMap[key] = [];
    comboMap[key].push(p);
  });

  let html = '<table class="matrix-table"><thead><tr>';
  html += '<th class="row-header">Lens ↓ / Sensor →</th>';
  sensorFams.forEach(sf => {
    html += `<th class="col-header"><div class="chip-name">${escapeHtml(sf)}</div></th>`;
  });
  html += '</tr></thead><tbody>';

  lenses.forEach(lens => {
    html += `<tr><th class="row-header">${escapeHtml(lens)}</th>`;
    sensorFams.forEach(sf => {
      const key = `${lens}|||${sf}`;
      const items = comboMap[key];
      if (items && items.length > 0) {
        const statuses = items.map(i => i.status);
        const hasGreen = statuses.includes("已出样");
        const hasOrange = statuses.includes("待出样");
        const hasRed = statuses.includes("待设计");
        const allGreen = hasGreen && !hasOrange && !hasRed;
        const allOrange = hasOrange && !hasGreen && !hasRed;
        const allRed = hasRed && !hasGreen && !hasOrange;

        let cellClass = "matrix-cell";
        if (allGreen) cellClass += " all-green";
        else if (allOrange) cellClass += " all-orange";
        else if (allRed) cellClass += " all-red";
        else cellClass += " mixed";

        let dots = "";
        if (hasGreen) dots += `<div class="dot" style="background:var(--green)"></div>`;
        if (hasOrange) dots += `<div class="dot" style="background:var(--orange)"></div>`;
        if (hasRed) dots += `<div class="dot" style="background:var(--red)"></div>`;

        html += `<td class="${cellClass}" onclick="openMatrixModal('${escapeAttr(lens)}','${escapeAttr(sf)}')">`;
        html += `<div class="count">${items.length}</div>`;
        html += `<div class="status-dots">${dots}</div>`;
        html += '</td>';
      } else {
        html += '<td class="matrix-cell empty"></td>';
      }
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById("matrixContainer").innerHTML = html;
  setupStickyPositions();
}

    `<span class="sensor-name">Lens: ${escapeHtml(lens)}</span><span class="sep">×</span><span class="chip-name">Sensor: ${escapeHtml(sensorFam)}</span>`;

  renderModalTable(items, "sensor");
  document.getElementById("modalOverlay").classList.add("active");
}

// ========== MODAL: All products ==========
function openAllProductsModal() {
  const products = getTypedProducts();
  const items = products;
  document.getElementById("modalTitle").innerHTML =
    `<span class="stat-label">全部产品</span><span class="sensor-name">（${items.length}款）</span>`;
  renderModalTable(items, "sensor");
  document.getElementById("modalOverlay").classList.add("active");
}

// ========== MODAL: Stat card ==========
function openStatModal(filterVal, isType) {
  const products = getTypedProducts();
  let items;
  let title;
  if (isType) {
    items = products.filter(p => p.type === filterVal);
    title = `<span class="stat-label">产品类型：</span><span class="sensor-name">${escapeHtml(filterVal)}</span>（${items.length}款）`;
  } else {
    items = products.filter(p => p.status === filterVal);
    title = `<span class="stat-label">产品状态：</span><span class="sensor-name">${escapeHtml(filterVal)}</span>（${items.length}款）`;
  }
  document.getElementById("modalTitle").innerHTML = title;
  renderModalTable(items, "sensor");
  document.getElementById("modalOverlay").classList.add("active");
}

// ========== RENDER MODAL TABLE ==========
function renderModalTable(items, groupBy) {
  const modalHeaders = ["产品类型","封装","接口","目标终端","GPIO","FOV","Serdes","尺寸","连接器","项目代号","产品状态","规格书","PMIC","操作"];
  const modalCols = [COL.type, COL.pkg, COL.iface, COL.terminal, COL.gpio, COL.fov, COL.serdes, COL.size, COL.conn, COL.code, COL.status, COL.spec, COL.pmic];

  let html = '<table class="modal-table"><thead><tr>';
  modalHeaders.forEach(h => { html += `<th>${escapeHtml(h)}</th>`; });
  html += '</tr></thead><tbody>';

  let groupCol, groupLabel;
  if (groupBy === "serdes") { groupCol = COL.serdes; groupLabel = "Serdes"; }
  else if (groupBy === "gpio") { groupCol = COL.gpio; groupLabel = "GPIO"; }
  else { groupCol = COL.sensor; groupLabel = "Sensor"; }

  const groups = {};
  items.forEach(p => {
    const gk = p.row[groupCol] || "(未指定)";
    if (!groups[gk]) groups[gk] = [];
    groups[gk].push(p);
  });
  Object.keys(groups).sort().forEach(gk => {
    html += `<tr class="group-row"><td colspan="${modalHeaders.length}">${groupLabel}: ${escapeHtml(gk)} （${groups[gk].length}款）</td></tr>`;
    groups[gk].forEach(p => {
      html += '<tr>';
      modalCols.forEach(colIdx => {
        const isStatus = colIdx === COL.status;
        html += `<td>${cellHtml(p.row[colIdx], isStatus)}</td>`;
      });
      html += `<td><div class="row-actions">`;
      html += `<button class="row-btn" onclick="openEditForm(${p.index})">编辑</button>`;
      html += `<button class="row-btn danger" onclick="deleteProduct(${p.index})">删除</button>`;
      html += `</div></td>`;
      html += '</tr>';
    });
  });

  html += '</tbody></table>';
  document.getElementById("modalBody").innerHTML = html;
}

function closeModal(e) {
  if (e && e.target !== document.getElementById("modalOverlay")) return;
  document.getElementById("modalOverlay").classList.remove("active");
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeModal(); closeForm(); }
});

  e.target.classList.add("active");

document.getElementById("searchInput").addEventListener("input", function(e) {

// ========== FORM: Add / Edit ==========
function openAddForm() {
  editingIndex = -1;
  document.getElementById("formTitle").textContent = "添加新产品";
  const body = document.getElementById("formBody");
  let html = "";
  FIELD_DEFS.forEach(f => {
    const cls = f.full ? "form-field full" : "form-field";
    const req = f.required ? '<span class="req">*</span>' : '';
    html += `<div class="${cls}"><label>${f.name} ${req}</label>`;
    if (f.type === "select") {
      html += `<select id="field_${f.col}" onchange="toggleCustomInput(${f.col})">`;
      f.options.forEach(o => { html += `<option value="${escapeAttr(o)}">${escapeHtml(o || "(空)")}</option>`; });
      html += `<option value="__custom__">自定义...</option>`;
      html += `</select>`;
      html += `<input type="text" id="custom_${f.col}" placeholder="输入自定义值（选自定义时启用）" style="display:none;margin-top:6px">`;
    } else {
      html += `<input type="text" id="field_${f.col}" placeholder="${escapeHtml(f.name)}">`;
    }
    html += `</div>`;
  });
  body.innerHTML = html;
  document.getElementById("formOverlay").classList.add("active");
}

function openEditForm(idx) {
  editingIndex = idx;
  const product = PRODUCTS[idx];
  if (!product) return;
  document.getElementById("formTitle").textContent = "编辑产品";
  document.getElementById("modalOverlay").classList.remove("active");
  const body = document.getElementById("formBody");
  let html = "";
  FIELD_DEFS.forEach(f => {
    const cls = f.full ? "form-field full" : "form-field";
    const req = f.required ? '<span class="req">*</span>' : '';
    const val = product[f.col] || "";
    html += `<div class="${cls}"><label>${f.name} ${req}</label>`;
    if (f.type === "select") {
      html += `<select id="field_${f.col}" onchange="toggleCustomInput(${f.col})">`;
      f.options.forEach(o => {
        const sel = o === val ? "selected" : "";
        html += `<option value="${escapeAttr(o)}" ${sel}>${escapeHtml(o || "(空)")}</option>`;
      });
      const isCustom = val && !f.options.includes(val);
      html += `<option value="__custom__" ${isCustom ? "selected" : ""}>自定义...</option>`;
      html += `</select>`;
      html += `<input type="text" id="custom_${f.col}" value="${isCustom ? escapeAttr(val) : ""}" placeholder="输入自定义值（选自定义时启用）" style="display:${isCustom ? "block" : "none"};margin-top:6px">`;
    } else {
      html += `<input type="text" id="field_${f.col}" value="${escapeAttr(val)}" placeholder="${escapeHtml(f.name)}">`;
    }
    html += `</div>`;
  });
  body.innerHTML = html;
  document.getElementById("formOverlay").classList.add("active");
}

function toggleCustomInput(col) {
  const sel = document.getElementById(`field_${col}`);
  const custom = document.getElementById(`custom_${col}`);
  if (!sel || !custom) return;
  custom.style.display = sel.value === "__custom__" ? "block" : "none";
}

function closeForm(e) {
  if (e && e.target !== document.getElementById("formOverlay")) return;
  document.getElementById("formOverlay").classList.remove("active");
}

function saveProduct() {
  for (const f of FIELD_DEFS) {
    if (f.required) {
      const el = document.getElementById(`field_${f.col}`);
      const customEl = document.getElementById(`custom_${f.col}`);
      let val = el.value;
      if (val === "__custom__") val = customEl ? customEl.value.trim() : "";
      if (!val || (el.value === "__custom__" && !val)) {
        showToast(`请填写必填项: ${f.name}`);
        if (el.value === "__custom__") customEl.focus(); else el.focus();
        return;
      }
    }
  }
  const row = new Array(17).fill("");
  FIELD_DEFS.forEach(f => {
    const el = document.getElementById(`field_${f.col}`);
    if (f.type === "select" && el.value === "__custom__") {
      const customEl = document.getElementById(`custom_${f.col}`);
      row[f.col] = customEl ? customEl.value.trim() : "";
    } else {
      row[f.col] = el ? el.value.trim() : "";
    }
  });
  if (editingIndex >= 0) {
    PRODUCTS[editingIndex] = row;
    showToast("已保存修改");
  } else {
    PRODUCTS.push(row);
    showToast("已添加新产品");
  }
  saveData();
  closeForm();
  renderStats();
  buildMatrix();
}

function deleteProduct(idx) {
  const product = PRODUCTS[idx];
  if (!product) return;
  const name = product[COL.code] || product[COL.sensor] || "该产品";
  if (!confirm(`确定删除「${name}」吗？`)) return;
  PRODUCTS.splice(idx, 1);
  saveData();
  showToast("已删除");
  renderStats();
  buildMatrix();
  document.getElementById("modalOverlay").classList.remove("active");
}

// ========== EXPORT / RESET ==========
// Helper: get typed products with inherited type
function getExportData() {
  let currentType = "";
  return PRODUCTS.map(r => {
    let row = [...r];
    if (row[COL.type]) currentType = row[COL.type];
    row[COL.type] = currentType;
    return row;
  });
}

// Helper: column definitions for export (ordered, readable names)
const EXPORT_COLS = [
  {col: COL.type, name: "产品类型"},
  {col: COL.pkg, name: "封装"},
  {col: COL.iface, name: "接口"},
  {col: COL.seq, name: "序号"},
  {col: COL.terminal, name: "目标终端"},
  {col: COL.sensor, name: "Sensor"},
  {col: COL.serdes, name: "Serdes芯片"},
  {col: COL.gpio, name: "GPIO"},
  {col: COL.fov, name: "FOV"},
  {col: COL.lens, name: "Lens"},
  {col: COL.size, name: "尺寸"},
  {col: COL.conn, name: "连接器"},
  {col: COL.code, name: "项目代号"},
  {col: COL.status, name: "产品状态"},
  {col: COL.spec, name: "规格书"},
  {col: COL.pmic, name: "PMIC"},
  {col: COL.remark, name: "备注"}
];

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function toggleExportMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById("exportMenu");
  menu.classList.toggle("show");
}
document.addEventListener("click", () => {
  document.getElementById("exportMenu").classList.remove("show");
});

function exportJSON() {
  const json = JSON.stringify(PRODUCTS, null, 2);
  downloadBlob(new Blob([json], { type: "application/json" }), "gen2_products.json");
  showToast("JSON 已导出");
  document.getElementById("exportMenu").classList.remove("show");
}

function exportCSV() {
  const data = getExportData();
  const headers = EXPORT_COLS.map(c => c.name);
  const rows = data.map(r => EXPORT_COLS.map(c => {
    let val = r[c.col] || "";
    val = String(val).replace(/"/g, '""');
    if (val.includes(",") || val.includes('"') || val.includes("\n")) val = `"${val}"`;
    return val;
  }));
  const csv = "\uFEFF" + [headers, ...rows].map(r => r.join(",")).join("\n");
  downloadBlob(new Blob([csv], { type: "text/csv;charset=utf-8" }), "gen2_products.csv");
  showToast("CSV 已导出");
  document.getElementById("exportMenu").classList.remove("show");
}

function exportExcel() {
  try {
    const data = getExportData();
    const headers = EXPORT_COLS.map(c => c.name);
    let html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><style>td,th{border:1px solid #ccc;padding:4px 8px;font-size:12px;white-space:nowrap}th{background:#f5f3f0;font-weight:bold}</style></head><body><table><thead><tr>';
    headers.forEach(h => { html += `<th>${h}</th>`; });
    html += '</tr></thead><tbody>';
    data.forEach(r => {
      html += '<tr>';
      EXPORT_COLS.forEach(c => {
        let val = r[c.col] || "";
        val = String(val).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
        html += `<td>${val}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table></body></html>';
    downloadBlob(new Blob(["\uFEFF" + html], { type: "application/vnd.ms-excel" }), "gen2_products.xls");
    showToast("Excel 已导出");
  } catch(e) { showToast("Excel导出失败: " + e.message); }
  document.getElementById("exportMenu").classList.remove("show");
}

function exportPNG() {
  showToast("正在生成图片...");
  try {
    const target = document.getElementById("matrixContainer");
    const w = target.scrollWidth, h = target.scrollHeight;
    const table = target.querySelector("table");
    if (!table) { showToast("未找到表格"); return; }
    const clone = table.cloneNode(true);
    const cs = getComputedStyle(table);
    const styles = `border-collapse:${cs.borderCollapse};border-spacing:${cs.borderSpacing};table-layout:fixed;background:#faf9f7;`;
    clone.setAttribute("style", styles);
    const ths = clone.querySelectorAll("th");
    ths.forEach(th => {
      const ccs = getComputedStyle(th);
      th.style.cssText = `padding:${ccs.padding};font-size:${ccs.fontSize};background:${ccs.backgroundColor};border:${ccs.border};text-align:${ccs.textAlign};border-radius:0;width:${ccs.width};`;
    });
    const tds = clone.querySelectorAll("td");
    tds.forEach(td => {
      const ccs = getComputedStyle(td);
      td.style.cssText = `padding:${ccs.padding};background:${ccs.backgroundColor};border:${ccs.border};text-align:${ccs.textAlign};border-radius:${ccs.borderRadius};width:${ccs.width};`;
    });
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px;height:${h}px;background:#faf9f7;">${clone.outerHTML}</div></foreignObject></svg>`;
    const svgBlob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
    const svgUrl = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement("canvas");
      canvas.width = w * 2;
      canvas.height = h * 2;
      const ctx = canvas.getContext("2d");
      ctx.scale(2, 2);
      ctx.fillStyle = "#faf9f7";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(svgUrl);
      canvas.toBlob(function(blob) {
        downloadBlob(blob, "gen2_matrix.png");
        showToast("PNG 已导出");
      }, "image/png");
    };
    img.onerror = function() {
      URL.revokeObjectURL(svgUrl);
      showToast("PNG导出失败，建议用截图工具");
    };
    img.src = svgUrl;
  } catch(e) { showToast("PNG导出失败: " + e.message); }
  document.getElementById("exportMenu").classList.remove("show");
}

function resetData() {
  if (!confirm("确定重置为初始数据？所有手动添加和修改的内容将丢失。")) return;
  PRODUCTS = BUILTIN_PRODUCTS.map(r => [...r]);
  saveData();
  showToast("已重置为初始数据");
  renderStats();
  buildMatrix();
}

// ========== TOAST ==========
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

// ========== STICKY POSITION (dynamic) ==========
function setupStickyPositions() {
  const header = document.querySelector('.header');
  const legend = document.querySelector('.legend');
  const toolbar = document.querySelector('.toolbar');
  const matrixInfo = document.querySelector('.matrix-info');
  if (!header || !legend || !toolbar || !matrixInfo) return;

  const headerH = header.offsetHeight;
  const legendH = legend.offsetHeight;
  const toolbarH = toolbar.offsetHeight;
  const infoH = matrixInfo.offsetHeight;

  legend.style.top = headerH + 'px';
  toolbar.style.top = (headerH + legendH) + 'px';
  matrixInfo.style.top = (headerH + legendH + toolbarH - 2) + 'px';

  const theadTop = headerH + legendH + toolbarH + infoH;
  const styleId = 'dynamic-sticky-style';
  let styleEl = document.getElementById(styleId);
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = styleId;
    document.head.appendChild(styleEl);
  }
  styleEl.textContent =
    `.matrix-table thead th { top: ${theadTop}px !important; }` +
    `.matrix-table thead th.row-header { top: ${theadTop}px !important; }`;
}

loadData().then(() => {

  buildMatrix();
  setTimeout(setupStickyPositions, 0);
});
window.addEventListener('resize', setupStickyPositions);
